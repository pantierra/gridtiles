<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gridtiles</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
        integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
          integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"
          integrity="sha384-QfbOCebHNw8pQiPAOd2IFee2v2A5VYZxBk0+JGZ5H+3mfzVIp6zsQNkTsfGJot93" crossorigin="anonymous"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; }
    #panel { position: absolute; top: 10px; left: 10px; padding: 8px 10px; background: #fffe;
             border-radius: 4px; box-shadow: 0 1px 4px #0003; font: 12px/1.5 system-ui, sans-serif; }
    #panel select { margin-bottom: 6px; }
    .class span { display: inline-block; width: 14px; height: 10px; margin-right: 6px; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <select id="layer" hidden></select>
    <div id="title"></div><div id="legend"></div>
  </div>
  <script>
    maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);
    // Sequential palette (ColorBrewer YlGnBu), one colour per class.
    const PALETTE = ["#ffffd9", "#edf8b1", "#c7e9b4", "#7fcdbb", "#41b6c4", "#1d91c0", "#225ea8", "#0c2c84"];
    const map = (window.map = new maplibregl.Map({
      container: "map",
      // OpenFreeMap Positron: a light basemap without an API key; squares go below its labels.
      style: "https://tiles.openfreemap.org/styles/positron",
      center: [0, 0],
      zoom: 1,
    }));
    const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
    const fmt = (v) => (typeof v === "number" ? v.toLocaleString(undefined, { maximumSignificantDigits: 4 }) : v);
    const esc = (v) => String(v).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

    function source(layer) {
      if (layer.tiles.endsWith(".pmtiles")) return { type: "vector", url: "pmtiles://" + new URL(layer.tiles, location.href) };
      return { type: "vector", tiles: [layer.tiles], minzoom: layer.minzoom, maxzoom: layer.maxzoom };
    }

    // The styled value: the first one; count values live in the tile property `n`.
    const styled = (layer) => (layer.values[0].agg === "count" ? "n" : layer.values[0].name);

    // Colour classes from the squares on screen: 7 quantile breaks, recomputed after each move, so
    // every zoom shows contrast. Equal breaks merge classes (step stops must increase strictly).
    function restyle() {
      const layer = window.current;
      if (!layer || !map.getLayer("cells")) return;
      const key = styled(layer);
      const values = map.queryRenderedFeatures({ layers: ["cells"] })
        .map((f) => f.properties[key]).filter((v) => typeof v === "number").sort((a, b) => a - b);
      const breaks = values.length ? [1, 2, 3, 4, 5, 6, 7].map((i) => values[Math.floor((i * values.length) / 8)]) : [];
      if (JSON.stringify(breaks) === JSON.stringify(window.breaks)) return;
      window.breaks = breaks;
      const step = ["step", ["get", key], PALETTE[0]];
      let last = -Infinity;
      breaks.forEach((b, i) => { if (b > last) step.push((last = b), PALETTE[i + 1]); });
      map.setPaintProperty("cells", "fill-color", step.length > 3 ? step : PALETTE[4]);
      const edges = [null, ...breaks, null];
      document.getElementById("legend").innerHTML = PALETTE.map((colour, i) => {
        const [lo, hi] = [edges[i], edges[i + 1]];
        const label = esc(lo === null ? `< ${fmt(hi)}` : hi === null ? `≥ ${fmt(lo)}` : `${fmt(lo)} – ${fmt(hi)}`);
        return `<div class="class"><span style="background:${colour}"></span>${label}</div>`;
      }).join("");
    }

    function show(layer) {
      for (const id of ["cells", "outlines"]) if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource("cells")) map.removeSource("cells");
      const labels = map.getStyle().layers.find((l) => l.type === "symbol")?.id;
      map.addSource("cells", source(layer));
      map.addLayer({ id: "cells", type: "fill", source: "cells", "source-layer": "cells",
                     paint: { "fill-color": PALETTE[4], "fill-opacity": 0.75 } }, labels);
      map.addLayer({ id: "outlines", type: "line", source: "cells", "source-layer": "cells",
                     minzoom: Math.max(0, layer.base_zoom - 2), paint: { "line-color": "#0003", "line-width": 0.5 } }, labels);
      const value = layer.values[0];
      const unit = value.unit ? ` (${value.unit})` : "";
      document.getElementById("title").textContent = `${layer.name}: ${value.name}${unit} per square`;
      window.breaks = null;  // colour classes follow once the squares are drawn (restyle)
      document.getElementById("legend").innerHTML = "";
      window.current = layer;
      if (layer.bounds) map.fitBounds(layer.bounds, { padding: 20, animate: false });
    }

    map.on("idle", restyle);

    map.on("mousemove", "cells", (e) => {
      const p = e.features[0].properties;
      const layer = window.current;
      const rows = [["qk", p.qk], ["z", p.z], ["n", fmt(p.n)]].concat(
        layer.values.filter((v) => v.agg !== "count").map((v) => [v.name, fmt(p[v.name]) + (v.unit ? ` ${v.unit}` : "")]));
      popup.setLngLat(e.lngLat).setHTML(rows.map(([k, v]) => `<div><b>${esc(k)}</b> ${esc(v)}</div>`).join("")).addTo(map);
      map.getCanvas().style.cursor = "pointer";
    });
    map.on("mouseleave", "cells", () => { popup.remove(); map.getCanvas().style.cursor = ""; });

    Promise.all([fetch("config.json").then((r) => r.json()), new Promise((r) => map.once("load", r))]).then(([config]) => {
      const select = document.getElementById("layer");
      if (config.layers.length > 1) {
        select.hidden = false;
        select.innerHTML = config.layers.map((l, i) => `<option value="${i}">${esc(l.name)}</option>`).join("");
        select.onchange = () => show(config.layers[select.value]);
      }
      show(config.layers[0]);
    });
  </script>
</body>
</html>
