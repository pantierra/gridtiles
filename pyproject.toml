[project]
name = "gridtiles"
version = "0.0.0"
description = "Turn point, polygon and raster data into a quadkey grid served as zoomable vector tiles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Development Seed" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
