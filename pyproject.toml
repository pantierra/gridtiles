[project]
name = "gridtiles"
version = "0.0.0"
description = "Turn point, polygon and raster data into a quadkey grid served as zoomable vector tiles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Development Seed" }]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 125

[tool.ruff.lint]
extend-select = ["I", "E", "F", "W"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = ["e2e: needs the compose services, including Martin"]
