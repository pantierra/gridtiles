[project]
name = "gridtiles"
version = "0.1.1"
description = "Serve PostGIS points and polygons as a quadkey grid of vector tiles, aggregated live"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Development Seed" }]
requires-python = ">=3.12"
dependencies = [
    "pmtiles>=3.8.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.2",
    "typer>=0.27.3",
]

[project.scripts]
gridtiles = "gridtiles.cli:app"

[dependency-groups]
dev = [
    "mapbox-vector-tile>=2.2.0",
    "mercantile>=1.2.1",
    "mypy",
    "playwright>=1.64.1",
    "pre-commit",
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 125

[tool.ruff.lint]
extend-select = ["I", "E", "F", "W"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["gridtiles.export"]  # pmtiles ships no type annotations
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = ["e2e: needs the compose services, including Martin"]
