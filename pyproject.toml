[project]
name = "gridtiles"
version = "0.1.0"
description = "Turn point, polygon and raster data into a quadkey grid served as zoomable vector tiles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Development Seed" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 125

[tool.ruff.lint]
extend-select = ["I", "E", "F", "W"]
