[project]
name = "gridtiles"
version = "0.0.0"
description = "Turn point, polygon and raster data into a quadkey grid served as zoomable vector tiles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Development Seed" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pmtiles>=3.8.1",
    "psycopg[binary]>=3.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "pyogrio>=0.13.0",
    "rasterio>=1.5.2",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
gridtiles = "gridtiles.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "mapbox-vector-tile>=2.2.0",
    "mercantile>=1.2.1",
    "mypy",
    "playwright>=1.64.1",
    "pre-commit",
    "pytest>=8",
    "ruff",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 125

[tool.ruff.lint]
extend-select = ["I", "E", "F", "W"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "pyogrio.*", "rasterio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gridtiles.export"]  # pmtiles ships no type annotations
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "-m 'not e2e and not perf'"
markers = ["e2e: needs the compose services, including Martin", "perf: nightly performance runs"]

[tool.importlinter]
root_package = "gridtiles"

[[tool.importlinter.contracts]]
name = "The CLI, exporter, server and API use only the backend interface"
type = "forbidden"
source_modules = ["gridtiles.api", "gridtiles.cli", "gridtiles.export", "gridtiles.server"]
forbidden_modules = ["gridtiles.backends.postgres"]
