name: Python check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint_and_test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - run: make up
      - run: make check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: build/e2e
          if-no-files-found: ignore
      - if: always()
        run: docker compose logs
      - if: always()
        run: make down
