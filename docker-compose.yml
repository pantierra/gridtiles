services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${GRIDTILES_DB_PORT:-5439}:5432"
    volumes:
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  martin:
    image: ghcr.io/maplibre/martin:1.16.0
    command: ["--config", "/config/martin.yaml"]
    ports:
      - "${GRIDTILES_MARTIN_PORT:-3000}:3000"
    volumes:
      - ./build/martin.yaml:/config/martin.yaml:ro
    depends_on:
      db:
        condition: service_healthy
